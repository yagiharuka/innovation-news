name: Review historical backlog

on:
  schedule:
    # 11:17-02:17 JST, hourly. The 03:00-10:59 window is reserved for
    # collection, fresh review, and morning-brief delivery.
    - cron: "17 2-17 * * *"
  push:
    branches:
      - main
    paths:
      # Updating this marker starts one resumable 500-item catch-up pass.
      - ".github/manual-history-review-trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: innovation-news-collection
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check whether historical review is due
        id: review_due
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" \
            || "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual historical catch-up requested."
          else
            python3 scripts/history_review_gate.py --request-budget 15
          fi

      - name: Set up Python
        if: steps.review_due.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.review_due.outputs.should_run == 'true'
        run: python -m pip install --requirement requirements.txt

      - name: Review one historical batch
        if: steps.review_due.outputs.should_run == 'true'
        run: |
          python -u scripts/collect.py --review-only
          python -u scripts/validate_outputs.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JAPANESE_SUMMARY_MODEL: gpt-5.6-luna
          JAPANESE_SUMMARY_BACKFILL_LIMIT: ${{ github.event_name != 'schedule' && '500' || '150' }}
          JAPANESE_SUMMARY_BATCH_SIZE: "10"
          JAPANESE_SUMMARY_MAX_TOKENS: "4000"
          JAPANESE_SUMMARY_REQUEST_BUDGET: ${{ github.event_name != 'schedule' && '75' || '15' }}
          JAPANESE_SUMMARY_INCLUDE_EXPIRED: ${{ github.event_name != 'schedule' && '1' || '0' }}
          JAPANESE_SUMMARY_REQUEST_INTERVAL_SECONDS: "0.5"

      - name: Commit historical review checkpoint
        if: steps.review_due.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data docs/innovation_news_ledger.xlsx
          if git diff --cached --quiet; then
            echo "No historical review changes to commit."
          else
            git commit -m "data: review historical backlog"
            git push
          fi
