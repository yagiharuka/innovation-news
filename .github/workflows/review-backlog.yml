name: Review candidate backlog

on:
  schedule:
    # GitHub may delay or drop individual scheduled events. Wake up every
    # 15 minutes, then use the checkpoint gate below to keep actual reviews
    # approximately 30 minutes apart.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      review_limit:
        description: "今回審査する候補数（1〜100）"
        required: false
        default: "100"
        type: string

permissions:
  contents: write
  models: read

concurrency:
  group: innovation-news-collection
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check whether a scheduled review is due
        id: review_due
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: bypassing the schedule checkpoint gate."
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          minimum_age_seconds = 25 * 60
          should_run = True
          detail = "checkpoint unavailable; running as a safe fallback"

          try:
              state = json.loads(Path("data/review_state.json").read_text(encoding="utf-8"))
              updated_at = str(state["updated_at"]).replace("Z", "+00:00")
              checkpoint = datetime.fromisoformat(updated_at)
              if checkpoint.tzinfo is None:
                  checkpoint = checkpoint.replace(tzinfo=timezone.utc)
              age_seconds = max(
                  0,
                  int((datetime.now(timezone.utc) - checkpoint.astimezone(timezone.utc)).total_seconds()),
              )
              should_run = age_seconds >= minimum_age_seconds
              detail = f"checkpoint age={age_seconds}s; minimum={minimum_age_seconds}s"
          except (OSError, KeyError, TypeError, ValueError, json.JSONDecodeError) as exc:
              detail = f"{detail}: {exc}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"should_run={'true' if should_run else 'false'}\n")

          print(f"Scheduled review due={should_run}; {detail}")
          PY

      - name: Set up Python
        if: steps.review_due.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.review_due.outputs.should_run == 'true'
        run: python -m pip install --requirement requirements.txt

      - name: Review one resumable batch
        if: steps.review_due.outputs.should_run == 'true'
        run: |
          if ! [[ "$REVIEW_LIMIT" =~ ^[0-9]+$ ]] \
            || (( REVIEW_LIMIT < 1 || REVIEW_LIMIT > 100 )); then
            echo "review_limit must be an integer from 1 to 100" >&2
            exit 2
          fi
          python -u scripts/collect.py --review-only
          python -u scripts/validate_outputs.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JAPANESE_SUMMARY_MODEL: openai/gpt-4o-mini
          # The 15-minute wake-up is only redundancy. The checkpoint gate caps
          # ordinary review runs at about 48/day: 48 x 2 + daily 25 + weekly 25
          # = 146 requests, within the free low-tier allowance of 150/day.
          JAPANESE_SUMMARY_BACKFILL_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.review_limit || '12' }}
          JAPANESE_SUMMARY_BATCH_SIZE: "6"
          JAPANESE_SUMMARY_MAX_TOKENS: "4000"
          JAPANESE_SUMMARY_REQUEST_BUDGET: ${{ github.event_name == 'workflow_dispatch' && '20' || '2' }}
          JAPANESE_SUMMARY_REQUEST_INTERVAL_SECONDS: "4.1"
          REVIEW_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.review_limit || '12' }}

      - name: Commit review checkpoint
        if: steps.review_due.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data docs/innovation_news_ledger.xlsx
          if git diff --cached --quiet; then
            echo "No review changes to commit."
          else
            git commit -m "data: review innovation backlog"
            git push
          fi
