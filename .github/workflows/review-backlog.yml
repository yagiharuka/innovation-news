name: Review candidate backlog

on:
  workflow_dispatch:
    inputs:
      review_limit:
        description: "今回審査する候補数（1〜100）"
        required: false
        default: "100"
        type: string

permissions:
  contents: write
  models: read

concurrency:
  group: innovation-news-collection
  cancel-in-progress: false
  queue: max

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Scheduled runs can wait behind daily/weekly collection. Always read
          # the latest checkpoint when the queued job actually starts.
          ref: main

      - name: Check whether a scheduled review is due
        id: review_due
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: bypassing the schedule checkpoint gate."
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          minimum_age_seconds = 25 * 60
          backlog_request_budget = 96
          checkpoint_due = True
          quota_available = True
          details = []

          try:
              state = json.loads(Path("data/review_state.json").read_text(encoding="utf-8"))
              updated_at = str(state["updated_at"]).replace("Z", "+00:00")
              checkpoint = datetime.fromisoformat(updated_at)
              if checkpoint.tzinfo is None:
                  checkpoint = checkpoint.replace(tzinfo=timezone.utc)
              age_seconds = int(
                  (datetime.now(timezone.utc) - checkpoint.astimezone(timezone.utc)).total_seconds()
              )
              if age_seconds < -300:
                  raise ValueError(f"checkpoint is unexpectedly in the future ({age_seconds}s)")
              age_seconds = max(0, age_seconds)
              checkpoint_due = age_seconds >= minimum_age_seconds
              details.append(f"checkpoint age={age_seconds}s; minimum={minimum_age_seconds}s")
          except (OSError, KeyError, TypeError, ValueError, json.JSONDecodeError) as exc:
              details.append(f"checkpoint unavailable; running as a safe fallback: {exc}")

          try:
              now = datetime.now(timezone.utc)
              run_log = json.loads(Path("data/run_log.json").read_text(encoding="utf-8"))
              requests_used = 0
              for run in run_log.get("runs", []):
                  if run.get("note") != "Review backlog":
                      continue
                  run_at = datetime.fromisoformat(str(run["run_at"]).replace("Z", "+00:00"))
                  if run_at.astimezone(timezone.utc).date() == now.date():
                      requests_used += max(0, int(run.get("summary_requests", 0)))
              quota_available = requests_used + 2 <= backlog_request_budget
              details.append(
                  f"backlog requests today={requests_used}; budget={backlog_request_budget}"
              )
          except (OSError, KeyError, TypeError, ValueError, json.JSONDecodeError) as exc:
              details.append(f"request log unavailable; running as a safe fallback: {exc}")

          should_run = checkpoint_due and quota_available

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"should_run={'true' if should_run else 'false'}\n")

          print(f"Scheduled review due={should_run}; {'; '.join(details)}")
          PY

      - name: Set up Python
        if: steps.review_due.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.review_due.outputs.should_run == 'true'
        run: python -m pip install --requirement requirements.txt

      - name: Review one resumable batch
        if: steps.review_due.outputs.should_run == 'true'
        run: |
          if ! [[ "$REVIEW_LIMIT" =~ ^[0-9]+$ ]] \
            || (( REVIEW_LIMIT < 1 || REVIEW_LIMIT > 100 )); then
            echo "review_limit must be an integer from 1 to 100" >&2
            exit 2
          fi
          python -u scripts/collect.py --review-only
          python -u scripts/validate_outputs.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JAPANESE_SUMMARY_MODEL: openai/gpt-4o-mini
          # There are 96 redundant wake-ups/day, but the checkpoint gate keeps
          # ordinary reviews near 48/day. The daily quota gate caps backlog use
          # at 96 requests; daily 25 + weekly 25 keeps the busiest day at 146,
          # within the free low-tier allowance of 150/day.
          JAPANESE_SUMMARY_BACKFILL_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.review_limit || '12' }}
          JAPANESE_SUMMARY_BATCH_SIZE: "6"
          JAPANESE_SUMMARY_MAX_TOKENS: "4000"
          JAPANESE_SUMMARY_REQUEST_BUDGET: ${{ github.event_name == 'workflow_dispatch' && '20' || '2' }}
          JAPANESE_SUMMARY_REQUEST_INTERVAL_SECONDS: "4.1"
          REVIEW_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.review_limit || '12' }}

      - name: Commit review checkpoint
        if: steps.review_due.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data docs/innovation_news_ledger.xlsx
          if git diff --cached --quiet; then
            echo "No review changes to commit."
          else
            git commit -m "data: review innovation backlog"
            git push
          fi
