name: Complete fresh candidate review

on:
  schedule:
    # Catch up only today's candidates every 30 minutes. Historical backlog
    # review is intentionally paused until morning completeness is stable.
    - cron: "7,37 * * * *"
  push:
    branches:
      - main
    paths:
      # Updating this marker provides a reliable, user-requested manual trigger.
      - ".github/manual-review-trigger"
  workflow_dispatch:
    inputs:
      review_limit:
        description: "今回審査する候補数（1〜100）"
        required: false
        default: "100"
        type: string
      force:
        description: "25分の間隔だけを無視する（API上限は常に守る）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  models: read

concurrency:
  group: innovation-news-collection
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Scheduled runs can wait behind daily/weekly collection. Always read
          # the latest checkpoint when the queued job actually starts.
          ref: main

      - name: Check whether fresh review is due
        id: review_due
        shell: bash
        env:
          FORCE_REVIEW: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' && inputs.force || false }}
          # A marker push is an explicit one-off catch-up request. Scheduled
          # runs keep the conservative free-tier budget.
          GATE_REQUEST_BUDGET: ${{ github.event_name != 'schedule' && '19' || '2' }}
        run: |
          args=()
          if [[ "$FORCE_REVIEW" == "true" ]]; then
            args+=(--force)
          fi
          python3 scripts/fresh_review_gate.py \
            --request-budget "$GATE_REQUEST_BUDGET" \
            "${args[@]}"

      - name: Set up Python
        if: steps.review_due.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.review_due.outputs.should_run == 'true'
        run: python -m pip install --requirement requirements.txt

      - name: Review one fresh resumable batch
        if: steps.review_due.outputs.should_run == 'true'
        run: |
          if ! [[ "$REVIEW_LIMIT" =~ ^[0-9]+$ ]] \
            || (( REVIEW_LIMIT < 1 || REVIEW_LIMIT > 100 )); then
            echo "review_limit must be an integer from 1 to 100" >&2
            exit 2
          fi
          python -u scripts/review_fresh.py
          python -u scripts/validate_outputs.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JAPANESE_SUMMARY_MODEL: openai/gpt-4o-mini
          # Two batches of six reduce omitted IDs while preserving the lowest free
          # daily request quota. The gate reserves daily/weekly capacity.
          JAPANESE_SUMMARY_BACKFILL_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.review_limit || github.event_name == 'push' && '100' || '12' }}
          JAPANESE_SUMMARY_BATCH_SIZE: "6"
          JAPANESE_SUMMARY_MAX_TOKENS: "4000"
          JAPANESE_SUMMARY_REQUEST_BUDGET: ${{ github.event_name != 'schedule' && '19' || '2' }}
          JAPANESE_SUMMARY_REQUEST_INTERVAL_SECONDS: "4.1"
          REVIEW_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.review_limit || github.event_name == 'push' && '100' || '12' }}

      - name: Commit review checkpoint
        if: steps.review_due.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data docs/innovation_news_ledger.xlsx
          if git diff --cached --quiet; then
            echo "No review changes to commit."
          else
            git commit -m "data: review innovation backlog"
            git push
          fi
