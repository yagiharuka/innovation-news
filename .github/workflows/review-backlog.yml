name: Review candidate backlog

on:
  schedule:
    # A single dedicated expression requests one review every 30 minutes.
    # Shared concurrency safely serializes it with daily/weekly collection.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      review_limit:
        description: "今回審査する候補数（1〜100）"
        required: false
        default: "100"
        type: string
      force:
        description: "25分の間隔だけを無視する（API上限は常に守る）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  models: read

concurrency:
  group: innovation-news-collection
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Scheduled runs can wait behind daily/weekly collection. Always read
          # the latest checkpoint when the queued job actually starts.
          ref: main

      - name: Check whether a scheduled review is due
        id: review_due
        shell: bash
        env:
          FORCE_REVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
          GATE_REQUEST_BUDGET: ${{ github.event_name == 'workflow_dispatch' && '20' || '2' }}
        run: |
          args=()
          if [[ "$FORCE_REVIEW" == "true" ]]; then
            args+=(--force)
          fi
          python3 scripts/review_gate.py \
            --request-budget "$GATE_REQUEST_BUDGET" \
            "${args[@]}"

      - name: Set up Python
        if: steps.review_due.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.review_due.outputs.should_run == 'true'
        run: python -m pip install --requirement requirements.txt

      - name: Review one resumable batch
        if: steps.review_due.outputs.should_run == 'true'
        run: |
          if ! [[ "$REVIEW_LIMIT" =~ ^[0-9]+$ ]] \
            || (( REVIEW_LIMIT < 1 || REVIEW_LIMIT > 100 )); then
            echo "review_limit must be an integer from 1 to 100" >&2
            exit 2
          fi
          python -u scripts/collect.py --review-only
          python -u scripts/validate_outputs.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JAPANESE_SUMMARY_MODEL: openai/gpt-4o-mini
          # Two batches of eight stay within the model's 8k input / 4k output
          # limits. The gate reserves daily/weekly collection capacity.
          JAPANESE_SUMMARY_BACKFILL_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.review_limit || '16' }}
          JAPANESE_SUMMARY_BATCH_SIZE: "8"
          JAPANESE_SUMMARY_MAX_TOKENS: "4000"
          JAPANESE_SUMMARY_REQUEST_BUDGET: ${{ github.event_name == 'workflow_dispatch' && '20' || '2' }}
          JAPANESE_SUMMARY_REQUEST_INTERVAL_SECONDS: "4.1"
          REVIEW_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.review_limit || '16' }}

      - name: Commit review checkpoint
        if: steps.review_due.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data docs/innovation_news_ledger.xlsx
          if git diff --cached --quiet; then
            echo "No review changes to commit."
          else
            git commit -m "data: review innovation backlog"
            git push
          fi
