name: Fix OECD Japanese title once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-oecd-title-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Correct the recovered OECD title and remove this one-shot workflow
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          old = "パナマの半導体エコシステム વિકાસを促進"
          new = "パナマの半導体エコシステム開発を促進"
          paths = [
              Path("data/news.csv"),
              Path("data/news.json"),
              Path("docs/data/news.json"),
          ]
          for path in paths:
              text = path.read_text(encoding="utf-8-sig" if path.suffix == ".csv" else "utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one malformed title, found {text.count(old)}")
              path.write_text(text.replace(old, new), encoding="utf-8-sig" if path.suffix == ".csv" else "utf-8")

          for path in (Path("data/news.json"), Path("docs/data/news.json")):
              data = json.loads(path.read_text(encoding="utf-8"))
              row = next(item for item in data["items"] if item["id"] == "3d1b1d6ff33e27a8034a0cda")
              assert row["title"] == new

          with Path("data/news.csv").open(encoding="utf-8-sig", newline="") as handle:
              row = next(
                  item for item in csv.DictReader(handle)
                  if item["canonical_id"] == "3d1b1d6ff33e27a8034a0cda"
              )
          assert row["title_ja"] == new
          PY

          git rm .github/workflows/fix-oecd-title-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.csv data/news.json docs/data/news.json
          git commit -m "data: fix OECD Japanese title"
          git pull --rebase origin main
          git push origin HEAD:main
