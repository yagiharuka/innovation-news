name: Daily innovation brief

on:
  schedule:
    # Start collection and strict review at 03:17 JST, one hour earlier.
    # Leave time for review completion before the 09:00 JST brief.
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "政策1年・8技術半年の履歴収集をもう一度実行する"
        required: false
        default: false
        type: boolean
permissions:
  contents: write

concurrency:
  group: innovation-news-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check whether daily collection is missing
        id: collection_due
        env:
          FORCE_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill || false }}
        run: |
          args=()
          if [[ "$FORCE_BACKFILL" == "true" ]]; then args+=(--force); fi
          python3 scripts/collection_due.py "${args[@]}"

      - name: Persist collection attempt before network calls
        if: steps.collection_due.outputs.should_run == 'true'
        run: |
          python3 scripts/collection_due.py --mark-attempt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/collection_attempt.json
          git commit -m "data: record daily collection attempt"
          git push

      - name: Set up Python
        if: steps.collection_due.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.collection_due.outputs.should_run == 'true'
        run: python -m pip install --requirement requirements.txt

      - name: Collect and build outputs
        if: steps.collection_due.outputs.should_run == 'true'
        id: api_batch
        run: |
          args=()
          if [[ "${FORCE_BACKFILL}" == "true" ]]; then
            args+=(--backfill)
          fi
          JAPANESE_SUMMARY_BACKFILL_LIMIT=150 \
          JAPANESE_SUMMARY_REQUEST_BUDGET=25 \
            python -u scripts/collect.py "${args[@]}"
          JAPANESE_SUMMARY_BACKFILL_LIMIT=1000 \
          JAPANESE_SUMMARY_REQUEST_BUDGET=85 \
            python -u scripts/review_fresh.py
          python -u scripts/validate_outputs.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SOURCE_FETCH_WORKERS: "8"
          JAPANESE_SUMMARY_MODEL: gpt-5.6-luna
          JAPANESE_SUMMARY_BATCH_SIZE: "6"
          JAPANESE_SUMMARY_MAX_TOKENS: "4000"
          JAPANESE_SUMMARY_REQUEST_INTERVAL_SECONDS: "4.1"
          FORCE_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill || false }}

      - name: Preserve API safety checkpoint after failure
        if: always() && steps.api_batch.outcome == 'failure'
        run: bash scripts/persist_api_safety.sh

      - name: Commit refreshed data
        if: steps.collection_due.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data docs/innovation_news_ledger.xlsx
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: refresh innovation brief"
            git push
          fi

      - name: Require complete fresh review
        if: steps.collection_due.outputs.should_run == 'true'
        run: python -u scripts/assert_fresh_review_complete.py

  # Rebuild derived outputs so source-registry changes are validated together.
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run tests and validate current outputs
        run: |
          python -m unittest discover -s tests
          python scripts/collect.py --preserve-published-from docs/data/news.json
          python scripts/validate_outputs.py
