name: Daily innovation brief

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "政策1年・8技術半年の履歴収集をもう一度実行する"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily.yml"
      - "assets/**"
      - "config/**"
      - "requirements.txt"
      - "scripts/**"

permissions:
  contents: write
  models: read

concurrency:
  group: innovation-news-collection
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name != 'schedule' || github.event.schedule == '0 21 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Collect and build outputs
        run: |
          args=()
          if [[ "${FORCE_BACKFILL}" == "true" ]]; then
            args+=(--backfill)
          fi
          python -u scripts/collect.py "${args[@]}"
          python -u scripts/validate_outputs.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_FETCH_WORKERS: "8"
          JAPANESE_SUMMARY_MODEL: openai/gpt-4o-mini
          JAPANESE_SUMMARY_BACKFILL_LIMIT: "150"
          JAPANESE_SUMMARY_BATCH_SIZE: "8"
          JAPANESE_SUMMARY_MAX_TOKENS: "4000"
          JAPANESE_SUMMARY_REQUEST_BUDGET: "25"
          JAPANESE_SUMMARY_REQUEST_INTERVAL_SECONDS: "4.1"
          FORCE_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill || false }}

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data docs/innovation_news_ledger.xlsx
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: refresh innovation brief"
            git push
          fi
