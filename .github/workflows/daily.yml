name: Daily innovation brief

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "政策1年・8技術半年の履歴収集をもう一度実行する"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily.yml"
      - "assets/**"
      - "config/**"
      - "requirements.txt"
      - "scripts/**"

permissions:
  contents: write
  models: read

concurrency:
  group: innovation-news-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Collect and build outputs
        run: |
          snapshot_dir="${RUNNER_TEMP}/innovation-news-published"
          mkdir -p "$snapshot_dir"
          cp docs/data/news.json "$snapshot_dir/news.json"
          args=()
          if [[ "${FORCE_BACKFILL}" == "true" ]]; then
            args+=(--backfill)
          fi
          python -u scripts/collect.py "${args[@]}"
          previous_count=$(jq -r '.article_count // 0' "$snapshot_dir/news.json")
          current_count=$(jq -r '.article_count // 0' docs/data/news.json)
          summary_errors=$(jq -r '.runs[-1].summary_errors // 0' data/run_log.json)
          if (( previous_count > 0 && current_count * 4 < previous_count * 3 && summary_errors > 0 )); then
            python -u scripts/collect.py --preserve-published-from "$snapshot_dir/news.json"
            preserved_count=$(jq -r '.article_count // 0' docs/data/news.json)
            echo "[GUARD] Preserved $preserved_count eligible articles after $summary_errors review batch errors."
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_FETCH_WORKERS: "8"
          JAPANESE_SUMMARY_MODEL: openai/gpt-4o-mini
          JAPANESE_SUMMARY_BACKFILL_LIMIT: "150"
          JAPANESE_SUMMARY_BATCH_SIZE: "10"
          FORCE_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill || false }}

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data docs/innovation_news_ledger.xlsx
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: refresh innovation brief"
            git push
          fi
