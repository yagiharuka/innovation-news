name: Daily innovation brief

on:
  schedule:
    # Start at 04:00 JST so fresh candidates can complete strict review
    # before the 08:00 JST morning brief.
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "政策1年・8技術半年の履歴収集をもう一度実行する"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily.yml"
      - "assets/**"
      - "config/**"
      - "requirements.txt"
      - "scripts/**"
      - "tests/**"

permissions:
  contents: write

concurrency:
  group: innovation-news-collection
  cancel-in-progress: false

jobs:
  collect:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' &&
      github.event.schedule == '0 19 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Collect and build outputs
        run: |
          args=()
          if [[ "${FORCE_BACKFILL}" == "true" ]]; then
            args+=(--backfill)
          fi
          JAPANESE_SUMMARY_BACKFILL_LIMIT=150 \
          JAPANESE_SUMMARY_REQUEST_BUDGET=25 \
            python -u scripts/collect.py "${args[@]}"
          JAPANESE_SUMMARY_BACKFILL_LIMIT=1000 \
          JAPANESE_SUMMARY_REQUEST_BUDGET=85 \
            python -u scripts/review_fresh.py
          python -u scripts/validate_outputs.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SOURCE_FETCH_WORKERS: "8"
          JAPANESE_SUMMARY_MODEL: gpt-5.6-luna
          JAPANESE_SUMMARY_BATCH_SIZE: "6"
          JAPANESE_SUMMARY_MAX_TOKENS: "4000"
          JAPANESE_SUMMARY_REQUEST_INTERVAL_SECONDS: "4.1"
          FORCE_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill || false }}

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data docs/innovation_news_ledger.xlsx
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: refresh innovation brief"
            git push
          fi

      - name: Require complete fresh review
        run: python -u scripts/assert_fresh_review_complete.py

  # Rebuild derived outputs so source-registry changes are validated together.
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run tests and validate current outputs
        run: |
          python -m unittest discover -s tests
          python scripts/collect.py --preserve-published-from docs/data/news.json
          python scripts/validate_outputs.py
